org.gradle.java.installations.fromEnv=JAVA_HOME
org.gradle.java.installations.auto-detect=true
# Homebrew's JDK 21 is keg-only, so /usr/libexec/java_home often only lists JDK 24.
# A missing path is ignored.
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
